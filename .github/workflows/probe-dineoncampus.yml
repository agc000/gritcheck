name: Probe — dineoncampus from a runner

# THROWAWAY. Delete once it has answered its question (Phase 6, task 6).
#
# THE QUESTION: Phase 0 established that dineoncampus sits behind Cloudflare bot
# detection, and that plain fetches get 403 while headless Chromium passes. That
# was measured from Alan's residential IP. GitHub runners have datacenter IPs,
# which are blocked considerably harder — so the scraper working locally is not
# evidence that it works in CI, and finding out on August 19 is too late.
#
# It probes BOTH paths deliberately:
#   1. plain curl        — expected to fail; documents the baseline
#   2. the real scraper  — the answer that matters
#
# A 403 in step 1 is NOT a blocker on its own. Step 2 is the verdict.
#
# No secrets are used or needed: --dry-run writes nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-dineoncampus.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ── 1. Baseline: what a plain request sees from a datacenter IP ────────
      - name: Plain curl — dineoncampus page
        continue-on-error: true
        run: |
          echo "runner egress IP:"
          curl -sS --max-time 20 https://api.ipify.org || echo "(could not determine)"
          echo ""
          code=$(curl -sS --max-time 30 -o body.html -w '%{http_code}' \
            https://dineoncampus.com/UMBC/hours-of-operation || echo "000")
          echo "HTTP status: $code"
          echo "first 200 bytes:"
          head -c 200 body.html || true
          echo ""

      - name: Plain curl — LibCal (expected to work, no bot detection)
        continue-on-error: true
        run: |
          code=$(curl -sS --max-time 30 -o libcal.json -w '%{http_code}' \
            'https://api3.libcal.com/api_hours_grid.php?iid=991&format=json&weeks=2' || echo "000")
          echo "HTTP status: $code"
          echo "first 200 bytes:"
          head -c 200 libcal.json || true
          echo ""

      # ── 2. The verdict: does OUR approach work from here? ──────────────────
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Real scraper, dry run — fetches live, writes nothing
        run: npm run scrape -- --dry-run
